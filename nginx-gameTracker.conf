# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=register_limit:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/m;

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;  # Accept any hostname/IP
    
    # Allow Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;  # Accept any hostname/IP - update with your domain if you have one
    
    root /var/www/gameTracker;
    index index.php dashboard.php;
    
    # SSL Configuration
    # Certificates will be managed by Certbot
    # After running certbot, these will be automatically configured
    # For now, using self-signed cert paths (will be replaced by certbot)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Hide Nginx version
    server_tokens off;
    
    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    
    # Logging
    access_log /var/log/nginx/gameTracker-access.log;
    error_log /var/log/nginx/gameTracker-error.log;
    
    # Maximum upload size
    client_max_body_size 10M;
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to database files
    location ~ /database/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to includes directory
    location ~ /includes/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to .git directory
    location ~ /\.git/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to PHP files in uploads directory (security)
    location ~ ^/uploads/.*\.php$ {
        deny all;
    }
    
    # Test-only internal endpoint — deny external access
    location = /api/v2/_ping.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Login endpoint with stricter rate limiting.
    # NB: MUST route through PHP-FPM directly (not try_files) — try_files
    # would find the file and serve as static, returning 405 on POST.
    location = /api/auth.php {
        limit_req zone=login_limit burst=2 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # (Removed a `location ~ ^/api/auth\.php\?action=register$` block that
    # never fired: nginx location matching doesn't include the query string.
    # The register-specific rate limit would need to be enforced in PHP if
    # we want it back.)

    # API endpoints with rate limiting. Same reason as /api/auth.php above:
    # route .php explicitly to PHP-FPM here; try_files would serve as static
    # and 405 on POST.
    location ~ ^/api/.+\.php$ {
        limit_req zone=api_limit burst=50 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
    
    # Vite build output — content-hashed filenames, safe to cache forever.
    # `^~` prefix beats the regex blocks below, so /js/dist/* gets 1y
    # immutable and never falls through to them (phase 4e, Fable §3).
    location ^~ /js/dist/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Unhashed app code (js/*.js, css/style.css). These filenames NEVER
    # change, so the browser has no way to notice a deploy unless it
    # revalidates. `expires -1` emits `Cache-Control: no-cache`, which means
    # "revalidate before use" — NOT "don't store": the file stays in cache
    # and the ETag turns each check into a cheap 304.
    #
    # This previously shared the media block below, which set
    # `expires 30d` + `Cache-Control: public, immutable`. That combination
    # was wrong twice over on an unhashed filename: max-age alone already
    # suppresses revalidation for 30 days, and `immutable` additionally
    # tells the browser not to revalidate even on an explicit reload. The
    # symptom is a deploy that appears to do nothing — landed for real when
    # phase 5/04 switched game-form.js to the v2 endpoint and any browser
    # with a warm cache kept calling v1.
    #
    # Long-lived caching for frontend code is fine once the filenames carry
    # a content hash; that is what /js/dist/ above is for, and where the
    # rest of js/ should end up as Vite adoption continues.
    location ~* \.(css|js)$ {
        expires -1;
        try_files $uri =404;
    }

    # Media + fonts. Uploads get unique generated filenames
    # (cover_<ts>_<hash>.jpg), so a long TTL is safe here. No `immutable`:
    # it buys nothing over max-age for these and would block recovery via
    # reload if a file were ever replaced in place.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        try_files $uri =404;
    }
    
    # Main application routing with general rate limiting
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP handling
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Forward Authorization header to PHP (PHP-FPM strips it by default
        # in some setups). Required for /api/v2/ Bearer-token endpoints.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # Increase timeouts for large operations
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        
        # Security headers for PHP responses
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
